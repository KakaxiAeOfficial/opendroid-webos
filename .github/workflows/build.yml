name: Build and Release OpenDroid APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''

    - name: Setup Consistent Signing Keystore
      run: |
        echo "" | base64 --decode > app/opendroid.keystore

    - name: Initialize Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.6
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare Release APK Artifact
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/OpenDroid-v1.0-build${{ github.run_number }}.apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/OpenDroid-Latest.apk

    - name: Upload Temporary Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenDroid-APK-Build-${{ github.run_number }}
        path: release-apk/OpenDroid-Latest.apk
        retention-days: 90

    - name: Publish Permanent GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "OpenDroid WebOS v1.0.${{ github.run_number }} (Latest Release)"
        body: |
          ### 📱 OpenDroid WebOS v1.0.${{ github.run_number }} Official Release

          > **Permanent Downloadable Release Build** (Never expires).

          🌐 **Live Web Controller:** [https://kakaxiaeofficial.github.io/opendroid-webos/](https://kakaxiaeofficial.github.io/opendroid-webos/)  
          📦 **Build Run:** #${{ github.run_number }}  
          🔖 **Commit:** `${{ github.sha }}`

          #### ✨ Features Included:
          - 🔄 **In-Place Seamless App Updates:** Consistent cryptographic signing key (no uninstalling needed!).
          - 🛡️ **6-Digit Secret PIN Security:** SHA-256 salted zero-knowledge channel.
          - 🌐 **Central Account & Multi-Device Hub:** Manage multiple phones seamlessly.
          - 📱 **5G Screen Mirroring (~30 FPS):** Full remote touch, swipes & hardware keys.
          - 🎥 **Remote Camera Stream & Silent Photo Capture.**
          - 🎙️ **Two-Way Audio (Walkie-Talkie):** Speak through phone loudspeaker.
          - 📁 **Advanced File Explorer:** Batch ZIP download, rename, delete & APK installer.
          - 📞 **SMS, Dialer, Call Logs & Live GPS Tracker.**
          - 📇 **Contacts Manager & Bi-Directional VCF Backup / Restore.**
          - 🥷 **Stealth Mode & Device Admin Lock.**

          ---
          #### 📦 Downloads:
          - **`OpenDroid-Latest.apk`** (Latest recommended build)
          - **`OpenDroid-v1.0-build${{ github.run_number }}.apk`** (Version-specific build)
        files: |
          release-apk/OpenDroid-Latest.apk
          release-apk/OpenDroid-v1.0-build${{ github.run_number }}.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

